name: Sync ESPN leaderboard
on:
  schedule:
    # Thu-Sun play, every 15 min (11:00-23:59 UTC, then 00:00-02:59 UTC for West Coast finishes)
    - cron: "*/15 11-23 * * 4,5,6,0"
    - cron: "*/15 0-2 * * 5,6,0,1"
  workflow_dispatch:
    inputs:
      preview:
        description: "Preview only: print what ESPN returns (nothing is written)"
        type: boolean
        default: true
      dry:
        description: "Dry run: read Firestore and show what would be written"
        type: boolean
        default: false
concurrency:
  group: espn-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: node sync.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PREVIEW: ${{ inputs.preview && '1' || '' }}
          DRY: ${{ inputs.dry && '1' || '' }}
