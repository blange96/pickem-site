name: Sync ESPN leaderboard
on:
  schedule:
    # Thu-Sun play, every 5 min from 5:00 to 22:59 Central (covers West Coast finishes)
    - cron: "*/5 5-22 * * 0,4-6"
      timezone: "America/Chicago"
  workflow_dispatch:
    inputs:
      preview:
        description: "Preview only: print what ESPN returns (nothing is written)"
        type: boolean
        default: true
      dry:
        description: "Dry run: read Firestore and show what would be written"
        type: boolean
        default: false
concurrency:
  group: espn-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: node sync.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PREVIEW: ${{ inputs.preview && '1' || '' }}
          DRY: ${{ inputs.dry && '1' || '' }}
