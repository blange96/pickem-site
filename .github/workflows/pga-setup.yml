name: Weekly field and odds
on:
  schedule:
    - cron: "7 7,18 * * 2,3" # Tue and Wed, twice a day (Central). Stops by itself once the first group tees off.
      timezone: "America/Chicago"
  workflow_dispatch:
    inputs:
      tournament_id:
        description: "Optional tournament id, e.g. R2026558 (blank = current event)"
        required: false
      dry:
        description: "Dry run: show what would be saved, write nothing"
        type: boolean
        default: true
jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run pga-setup.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PGA_API_KEY: ${{ secrets.PGA_API_KEY }}
          TOURNAMENT_ID: ${{ inputs.tournament_id }}
          DRY: ${{ inputs.dry && '1' || '' }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          cd "$(dirname "$(find . -name pga-setup.js -not -path '*/node_modules/*' | head -1)")"
          npm install --no-audit --no-fund
          node pga-setup.js
